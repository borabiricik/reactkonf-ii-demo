version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: reactkonf_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: reactkonf_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - reactkonf_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3

  adminer:
    image: adminer:latest
    container_name: reactkonf_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - reactkonf_network
    depends_on:
      - postgres

volumes:
  postgres_data:
    driver: local

networks:
  reactkonf_network:
    driver: bridge
